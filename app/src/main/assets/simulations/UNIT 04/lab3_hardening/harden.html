<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Hardening panel</title>
  <!-- Match the app's Light / Dark mode before the page draws. -->
  <script>try{document.documentElement.setAttribute('data-theme',AndroidLab.theme())}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="sim-ribbon">Simulated lab &middot; fictional PCs and programs &middot; nothing is installed or run</div>

  <div class="desk-head">
    <h1>Hardening panel</h1>
    <p>Lab 3 baseline &middot; starts as Lab 2 was set up</p>
  </div>
  <div class="tabs"><a class="tab" href="patch.html">Patch</a><a class="tab" href="allow.html">Allow</a><a class="tab" href="accounts.html">Accounts</a><a class="tab on" href="harden.html">Harden</a><a class="tab" href="stack.html">Layers</a></div>

  <div class="twin">
    <div class="meter-box">
      <div class="meter-top"><span>Attack risk</span><b id="risk-num"></b></div>
      <div class="meter"><i id="risk-bar"></i><span class="mark" style="left:10%"></span></div>
      <div class="muted" style="margin-top:6px">target: 10 or less</div>
    </div>
    <div class="meter-box">
      <div class="meter-top"><span>Help-desk complaints</span></div>
      <div class="complaints" id="cmp-num"></div>
      <div class="muted">target: 0</div>
    </div>
  </div>
  <div class="pad" id="tickets"></div>

  <div class="section-label">Settings</div>
  <div id="settings"></div>
  <div class="pad"><div class="banner" id="harden-banner"></div></div>

  <div class="foot">Both meters update as you change a setting.</div>

  <script src="script.js"></script>
  <script>renderHarden();</script>
</body>
</html>
