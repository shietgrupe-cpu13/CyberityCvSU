<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Mailbox</title>
  <!-- Match the app's Light / Dark mode before the page draws. -->
  <script>try{document.documentElement.setAttribute('data-theme',AndroidLab.theme())}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="sim-ribbon">Practice simulation · nothing here reaches the internet</div>

  <div class="mail-head">
    <h1>Inbox</h1>
    <p id="unread-count">student.account@cvsu.edu.ph · 2 unread</p>
  </div>

  <div class="appui" style="margin: 12px">
    <b>This is the simulation</b>
    Tap a message to open it. Everything you open, tap or expand is recorded as evidence.
  </div>

  <div id="list" class="mail-list"></div>

  <div class="foot">Swipe the bar at the very top of the screen down to return to your task.</div>

  <script src="script.js"></script>
  <script>renderMailbox('list');</script>
</body>
</html>
