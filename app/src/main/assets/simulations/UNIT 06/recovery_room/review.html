<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Post-incident review</title>
  <!-- Match the app's Light / Dark mode before the page draws. -->
  <script>try{document.documentElement.setAttribute('data-theme',AndroidLab.theme())}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="sim-ribbon">Simulated recovery room &middot; fictional people, accounts and amounts</div>

  <div class="topbar">
    <button class="back-btn" onclick="location.href='room.html'">&#8592; Room</button>
    <span class="topbar-title">Post-incident review</span>
  </div>

  <div class="detail">
    <div class="appui">
      <b>Rebuild the incident</b>
      Tap the events below in the order they happened. Each one drops into the next slot.
    </div>

    <div class="section-label flush">Timeline</div>
    <div id="timeline"></div>

    <div class="row-btns">
      <button class="cta ghost" onclick="undoEvent()">UNDO</button>
      <button class="cta ghost" onclick="clearTimeline()">CLEAR</button>
    </div>

    <div class="section-label flush">Events to place</div>
    <div id="pool"></div>

    <button class="cta" onclick="checkTimeline()">CHECK TIMELINE</button>
    <div class="banner" id="review-banner"></div>
    <div id="stats"></div>
  </div>

  <div class="foot">A review is about what happened and what changes next, not about blame.</div>

  <script src="script.js"></script>
  <script>renderReview();</script>
</body>
</html>
